<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmed | Solace</title>
 
    <link rel="stylesheet" href="confirmation.css">
    
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<div class="confirmation-card">

    <div class="success-icon">
        <i class="fa-solid fa-circle-check"></i>
    </div>

    <h1>Booking Confirmed!</h1>

    <p>
        Thank you for choosing <strong>Solace Hotels</strong>.
        Your reservation has been confirmed successfully.
    </p>

    <div class="booking-details">

        <div class="row">
            <span>Booking ID</span>
            <strong>SLC-2026-000245</strong>
        </div>

        <div class="row">
            <span>Guest</span>
            <strong>John Doe</strong>
        </div>

        <div class="row">
            <span>Hotel</span>
            <strong>Solace Grand Hotel</strong>
        </div>

        <div class="row">
            <span>Room</span>
            <strong>Executive Suite</strong>
        </div>

        <div class="row">
            <span>Check-in</span>
            <strong>15 July 2026</strong>
        </div>

        <div class="row">
            <span>Check-out</span>
            <strong>18 July 2026</strong>
        </div>

        <div class="row">
            <span>Guests</span>
            <strong>2 Adults</strong>
        </div>

        <div class="row">
            <span>Total Paid</span>
            <strong>₦93,000</strong>
        </div>

    </div>

    <div class="buttons">

        <button>Download Receipt</button>

        <button>Print Receipt</button>

        <button>View Booking</button>

        <button>Back to Home</button>

    </div>

</div>

</body>
</html>
